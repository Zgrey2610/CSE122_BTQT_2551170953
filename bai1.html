<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POEM</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main>
        <div class="container">
            <div clas="poem">
                <div class="title">
                    <h1>BỐN MÙA</h1>
                </div>
                <div class="main">
                    <div class="p1">
                        <p>Xuân về hoa nở khắp trời</p>
                        <p>Hạ sang nắng cháy rạng người phố quen</p>
                        <p>Thu về lá rụng bên thềm</p>
                    </div>
                    <hr class="doan">
                    <div class="p2">
                        <p>Đông sang gió lạnh em đợi chờ</p>
                        <p>Bốn mùa là bốn giấc mơ</p>
                        <p>Thời gian đi mãi ta chờ đợi ai</p>
                    </div>
                     <hr class="doan">
            
                    <div class="p3">
                         <p>Một năm rồi lại một năm</p>
                         <p>Vãn còn câu hát thì thầm quê hương</p>
                         <p>Chờ xuân nắng mới soi đường</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
